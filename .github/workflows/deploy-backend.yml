name: Deploy Backend

on:
  push:
    branches:
      - main-disabled

jobs:
  deploy:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          COMPOSE_ENV: ${{ secrets.COMPOSE_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: BACKEND_ENV,COMPOSE_ENV
          script: |
            set -e

            if [ -z "$COMPOSE_ENV" ]; then
              echo "COMPOSE_ENV secret is empty"
              exit 1
            fi

            if [ -z "$BACKEND_ENV" ]; then
              echo "BACKEND_ENV secret is empty"
              exit 1
            fi

            cd /var/www/turnoflow/backend

            echo "Pulling latest code..."
            git pull origin main

            echo "Writing environment files..."
            printf '%s' "$COMPOSE_ENV" > /var/www/turnoflow/.env
            printf '%s' "$BACKEND_ENV" > .env

            echo "Building and restarting backend..."
            docker compose -f /var/www/turnoflow/docker-compose.yml up -d --build backend

            echo "Backend deployed successfully."

